<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enter your code — ReviewReply AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #F5F4EE; color: #2D2A26; font-family: -apple-system, sans-serif; padding: 24px;
    position: relative; overflow: hidden;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes floatBubble {
    0%   { transform: translate(0, 0) rotate(-6deg); }
    50%  { transform: translate(14px, -22px) rotate(3deg); }
    100% { transform: translate(0, 0) rotate(-6deg); }
  }
  .floating-bubble { position: absolute; pointer-events: none; animation: floatBubble 7s ease-in-out infinite; opacity: 0.12; }
  .fb1 { top: 8%; left: 5%; width: 160px; animation-duration: 8s; }
  .fb2 { bottom: 10%; right: 8%; width: 100px; animation-duration: 6s; animation-delay: -2s; }
  .wrap { max-width: 400px; width: 100%; text-align: center; animation: fadeUp 0.5s ease both; position: relative; z-index: 1; }
  .card { background: #FFFFFF; border: 1px solid #E4E1D6; border-radius: 16px; padding: 32px 28px; }
  input {
    width: 100%; box-sizing: border-box; border-radius: 10px; padding: 12px 14px; font-size: 15px;
    background: #FAF9F4; border: 1px solid #E4E1D6; color: #2D2A26; margin-bottom: 12px; outline: none;
  }
  button {
    width: 100%; border: none; cursor: pointer; border-radius: 10px; padding: 13px;
    font-size: 15px; font-weight: 600; background: #D97757; color: #FFFFFF;
    transition: transform 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: #B34B3C; font-size: 13px; margin-top: 10px; }
  .back { display: inline-block; margin-top: 16px; color: #A56A45; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>

<svg class="floating-bubble fb1" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v11H8l-4 4V4z" stroke="#D97757" strokeWidth="1.6" strokeLinejoin="round"/></svg>
<svg class="floating-bubble fb2" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v11H8l-4 4V4z" stroke="#D97757" strokeWidth="1.6" strokeLinejoin="round"/></svg>

<div class="wrap">
  <div class="card">
    <h1 style="font-family:'Fraunces',serif; font-size:24px; margin:0 0 8px;">Enter your code</h1>
    <p style="color:#87837A; font-size:14px; margin:0 0 22px;">Unlock unlimited generations on ReviewReply AI.</p>
    <input type="text" id="codeInput" placeholder="Your access code" />
    <button id="unlockBtn" onclick="unlock()">Unlock</button>
    <p class="error" id="errorMsg" style="display:none;"></p>
    <a class="back" href="/">← Back without unlocking</a>
  </div>
</div>

<script>
  async function unlock() {
    const code = document.getElementById('codeInput').value.trim();
    const btn = document.getElementById('unlockBtn');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    if (!code) return;

    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
      if (code.toUpperCase().startsWith('REPLY-')) {
        const res = await fetch('/api/redeem-appsumo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || 'Code not recognized.');
        }
      }
      localStorage.setItem('rr_unlocked', 'true');
      localStorage.setItem('rr_licenseCode', code);
      window.location.href = '/?welcome=1';
    } catch (err) {
      errorMsg.textContent = err.message || 'Something went wrong.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Unlock';
    }
  }

  document.getElementById('codeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') unlock();
  });
</script>

</body>
</html>
